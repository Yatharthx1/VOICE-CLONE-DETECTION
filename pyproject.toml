[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_clone_detection"  # <--- Change this to rename the project/package anytime!
version = "1.0.0"
description = "Real-Time AI Voice Cloning & Deepfake Detection Framework"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Yatharth" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "soundfile>=0.12.1",
    "pydantic>=2.5.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
voice-clone-detector = "src.api.server:start_server"
